<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
    <link rel="stylesheet" href="Task1.css">
</head>
<body>
    <div class="container">
        <h1>Course Registration Form</h1>
        <p class="subtitle">Register for your preferred course</p>
        <div class="line"></div>

        <form id="studentForm">
            <div class="form-row">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="Full_Name" placeholder="Enter your full name" required>
                </div>
                <div class="field">
                    <label>Email Address</label>
                    <input type="email" name="Email" placeholder="Enter your email" required>
                </div>
                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" name="Phone" placeholder="Enter phone number" required>
                </div>
                <div class="field">
                    <label>Age</label>
                    <input type="number" name="Age" value="18" min="1">
                </div>
                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date" name="DOB">
                </div>
                <div class="field">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label><input type="radio" name="Gender" value="Male"> Male</label>
                        <label><input type="radio" name="Gender" value="Female"> Female</label>
                        <label><input type="radio" name="Gender" value="Other"> Other</label>
                    </div>
                </div>
                <div class="field">
                    <label>Select Course</label>
                    <select name="Course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                    </select>
                </div>
                <div class="field">
                    <label>Education / Qualification</label>
                    <input type="text" name="Education" placeholder="Enter your qualification">
                </div>
                <div class="field">
                    <label>College / Institution</label>
                    <input type="text" name="College" placeholder="Enter your college or institution">
                </div>
                <div class="field">
                    <label>Preferred Learning Mode</label>
                    <div class="radio-group">
                        <label><input type="radio" name="Mode" value="Online"> Online</label>
                        <label><input type="radio" name="Mode" value="Offline"> Offline</label>
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Address</label>
                <textarea name="Address" rows="3" placeholder="Enter your complete address"></textarea>
            </div>

            <div class="field">
                <label>Course Duration (in months)</label>
                <input type="number" name="Duration" value="3" min="1">
            </div>

            <hr>

            <div class="buttons">
                <button type="submit" class="register">Register Now</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </form>
    </div>

    <!-- Load the Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://afmhlruhpydamyjbieuv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pjAfvVECTNit1TXNSfsK8A_VZvGHCkC';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const form = document.getElementById('studentForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const student = {
                full_name: formData.get('Full_Name'),
                email: formData.get('Email'),
                phone: formData.get('Phone'),
                course: formData.get('Course')
            };

            const btn = form.querySelector('.register');
            btn.innerHTML = "Saving to Database...";

            const { error } = await supabaseClient
                .from('registrations')
                .insert([student]);

            if (error) {
                alert("Error: " + error.message);
                btn.innerHTML = "Register Now";
            } else {
                alert("Registration Successful! Saved to Cloud Database.");
                form.reset();
                btn.innerHTML = "Register Now";
            }
        });
    </script>
</body>
</html>
