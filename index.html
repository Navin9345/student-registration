<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
    <link rel="stylesheet" href="Task1.css">
</head>
<body>
    <div class="container">
        <h1>Course Registration Form</h1>
        <p class="subtitle">Register for your preferred course</p>
        <div class="line"></div>

        <!-- Form tag updated to point to the PHP file -->
        <form action="save.php" method="POST" enctype="multipart/form-data">

            <div class="form-row">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="full_name" placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="Enter phone number" required>
                </div>

                <div class="field">
                    <label>Age</label>
                    <input type="number" name="age" value="18" min="1">
                </div>

                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date" name="dob">
                </div>

                <div class="field">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male"> Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Female"> Female
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Other"> Other
                        </label>
                    </div>
                </div>

                <div class="field">
                    <label>Select Course</label>
                    <select name="course">
                        <option value="">Select Course</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                    </select>
                </div>

                <div class="field">
                    <label>Education / Qualification</label>
                    <input type="text" name="education" placeholder="Enter your qualification">
                </div>

                <div class="field">
                    <label>College / Institution</label>
                    <input type="text" name="college" placeholder="Enter your college or institution">
                </div>

                <div class="field">
                    <label>Preferred Learning Mode</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="mode" value="Online"> Online
                        </label>
                        <label>
                            <input type="radio" name="mode" value="Offline"> Offline
                        </label>
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Address</label>
                <textarea name="address" rows="3" placeholder="Enter your complete address"></textarea>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Upload Profile Photo</label>
                    <input type="file" name="profile_photo">
                </div>
                <div class="field">
                    <label>Upload ID Proof</label>
                    <input type="file" name="id_proof">
                </div>
            </div>

            <div class="field">
                <label>Course Duration (in months)</label>
                <input type="number" name="duration" value="3" min="1">
            </div>

            <div class="terms">
                <label>Terms & Conditions</label>
                <p>
                    <input type="checkbox" name="terms" required> I agree to the <a href="#">Terms & Conditions</a>
                </p>
            </div>

            <hr>

            <div class="buttons">
                <button type="submit" class="register">Register Now</button>
                <button type="reset" class="reset">Reset</button>
            </div>

        </form>
    </div>
</body>
</html>
