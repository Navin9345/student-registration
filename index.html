<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
    <link rel="stylesheet" href="Task1.css">
</head>

<body>

    <div class="container">

        <h1>Course Registration Form</h1>
        <p class="subtitle">Register for your preferred course</p>
        <div class="line"></div>

        <form>

            <div class="form-row">

                <div class="field">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>

                <div class="field">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter phone number">
                </div>

                <div class="field">
                    <label>Age</label>
                    <input type="number" value="18" min="1">
                </div>

                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

                <div class="field">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Other
                        </label>
                    </div>
                </div>

                <div class="field">
                    <label>Select Course</label>

                    <select>
                        <option>Select Course</option>
                        <option>Web Development</option>
                        <option>Data Science</option>
                        <option>UI/UX Design</option>
                    </select>
                </div>

                <div class="field">
                    <label>Education / Qualification</label>
                    <input type="text" placeholder="Enter your qualification">
                </div>

                <div class="field">
                    <label>College / Institution</label>
                    <input type="text" placeholder="Enter your college or institution">
                </div>

                <div class="field">
                    <label>Preferred Learning Mode</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="mode">
                            Online
                        </label>

                        <label>
                            <input type="radio" name="mode">
                            Offline
                        </label>
                    </div>
                </div>

            </div>

            <div class="field">
                <label>Address</label>
                <textarea rows="3" placeholder="Enter your complete address"></textarea>
            </div>

            <div class="form-row">

                <div class="field">
                    <label>Upload Profile Photo</label>
                    <input type="file">
                </div>

                <div class="field">
                    <label>Upload ID Proof</label>
                    <input type="file">
                </div>

            </div>

            <div class="field">
                <label>Course Duration (in months)</label>
                <input type="number" value="3" min="1">
            </div>

            <div class="terms">

                <label>Terms & Conditions</label>

                <p>
                    <input type="checkbox">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </p>

            </div>

            <hr>

            <div class="buttons">

                <button type="submit" class="register">
                    Register Now
                </button>

                <button type="reset" class="reset">
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>
</html>
